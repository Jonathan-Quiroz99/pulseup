org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter's Gradle plugin does not yet fully support AGP 9's new DSL
# (github.com/flutter/flutter/issues/184838, migration still in progress
# upstream as of Aug 2026). Keep both opted out until Flutter ships full
# support, otherwise applying dev.flutter.flutter-gradle-plugin fails with a
# ClassCastException.
android.builtInKotlin=false
android.newDsl=false
